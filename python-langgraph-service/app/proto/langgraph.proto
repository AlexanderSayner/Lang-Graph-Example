syntax = "proto3";

package langgraph;

// LangGraph Service definition
service LangGraphService {
  // Build a new graph with the given configuration
  rpc BuildGraph (BuildGraphRequest) returns (BuildGraphResponse);

  // Execute a graph with the given input
  rpc ExecuteGraph (ExecuteGraphRequest) returns (stream ExecuteGraphResponse);

  // Get graph state
  rpc GetGraphState (GetGraphStateRequest) returns (GetGraphStateResponse);

  // Update graph state
  rpc UpdateGraphState (UpdateGraphStateRequest) returns (UpdateGraphStateResponse);

  // Get a graph history
  rpc GetExecutionHistory (GraphHistoryRequest) returns (GraphHistoryResponse);

  // Rewind a graph
  rpc RewindGraph (RewindGraphRequest) returns (RewindGraphPayload);

  // Copilot questions chat
  rpc AskCopilot (CopilotRequest) returns (CopilotResponse);

  // List the models a provider offers (drives the UI's model suggestions)
  rpc ListLlmModels (ListLlmModelsRequest) returns (ListLlmModelsResponse);

  // Service-wide LLM settings the backend exposes to the UI: which provider a graph that
  // selects none actually runs on, and whether the shared service key may be spent at all.
  rpc GetLlmSettings (GetLlmSettingsRequest) returns (GetLlmSettingsResponse);

  // Cancel a graph execution that is currently running (mid-node, mid-LLM call).
  rpc CancelGraphExecution (CancelGraphExecutionRequest) returns (CancelGraphExecutionResponse);
}

// ==========================================
// HTTP Request Service (Execution)
// ==========================================
service HttpRequestService {
  // Execute an HTTP Request
  rpc ExecuteHttpRequest (HttpRequestInput) returns (HttpRequestOutput);
}

service JavaGraphProvider {
  rpc GetGraphDefinition (GetGraphDefinitionRequest) returns (GetGraphDefinitionResponse);
}

message GetGraphDefinitionRequest {string graph_id = 1;}
message GetGraphDefinitionResponse {string definition_json = 1;}

// Message for building a graph
message BuildGraphRequest {
  string graph_id = 1;
  string graph_name = 2;
  repeated NodeDefinition nodes = 3;
  repeated EdgeDefinition edges = 4;
  map<string, string> config = 5;
}

message NodeDefinition {
  string node_id = 1;
  string node_type = 2;
  string handler_name = 3;
  map<string, string> metadata = 4;
}

message EdgeDefinition {
  string source = 1;
  string target = 2;
  string condition = 3;
}

message BuildGraphResponse {
  bool success = 1;
  string graph_id = 2;
  string message = 3;
}

// Message for executing a graph
message ExecuteGraphRequest {
  string graph_id = 1;
  string input = 2;
  map<string, string> context = 3;
  bool stream_output = 4;
  string thread_id = 5;
}

message ExecuteGraphResponse {
  string event_type = 1;
  string node_id = 2;
  string output = 3;
  map<string, string> state = 4;
  int64 timestamp = 5;
  string error_message = 6;
  int32 total_tokens = 7;
  // Who paid for this node's model call: "user" (a personal key from the account
  // database), "service" (the shared config-based key) or "" (the node called no model).
  // Surfaced in the UI as "served by the shared service key" so a subsidised run is
  // never invisible. Never carries a credential.
  string llm_billing = 8;
}

// Message for getting graph state
message GetGraphStateRequest {
  string graph_id = 1;
  string thread_id = 2;
}

message GetGraphStateResponse {
  bool success = 1;
  map<string, string> state = 2;
  string current_node = 3;
  repeated string node_history = 4;
}

// Message for updating graph state
message UpdateGraphStateRequest {
  string graph_id = 1;
  string thread_id = 2;
  map<string, string> state_updates = 3;
  string as_node = 4;
}

message UpdateGraphStateResponse {
  bool success = 1;
  map<string, string> updated_state = 2;
}

// Message for listing graphs
message ListGraphsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListGraphsResponse {
  repeated GraphInfo graphs = 1;
  string next_page_token = 2;
}

message GraphInfo {
  string graph_id = 1;
  string graph_name = 2;
  int32 node_count = 3;
  string created_at = 4;
  string status = 5;
}

// Message for deleting a graph
message DeleteGraphRequest {
  string graph_id = 1;
}

message DeleteGraphResponse {
  bool success = 1;
  string message = 2;
}

// Message for a graph history
message GraphHistoryRequest {
  string graph_id = 1;
  string thread_id = 2;
}

message StateSnapshot {
  string node_id = 1;       // The node that was just executed or is about to run
  string state_json = 2;    // The full state variables as a JSON string
  string timestamp = 3;     // When this step occurred
  int32 tokens_used = 4;    // Tokens spent in THIS specific node
  int32 total_tokens = 5;   // Cumulative tokens spent up to this node
}

message GraphHistoryResponse {
  repeated StateSnapshot history = 1;
}

message RewindGraphRequest {
  string graph_id = 1;
  string thread_id = 2;
  string target_state_json = 3; // The JSON state to revert to
  string target_node_id = 4; // The node we are rewinding to
}

message RewindGraphPayload {
  bool success = 1;
  string message = 2;
}

// ==========================================
// HTTP Request Messages
// ==========================================

message HttpRequestInput {
  string method = 1;                // GET, POST, PUT, DELETE
  string url = 2;                   // URL with potential {{variable}} placeholders
  map<string, string> headers = 3;  // Request Headers
  string body = 4;                  // Request Body (JSON string)
  string state_json = 5;            // Current Graph State variables (JSON string)
}

message HttpRequestOutput {
  int32 status_code = 1;            // HTTP Status Code
  string body = 2;                  // Response Body
  map<string, string> headers = 3;  // Response Headers
  bool success = 4;                 // True if network call succeeded
  string error_message = 5;         // Error details if success is false
}

// ==========================================
// Copilot Messages
// ==========================================

message CopilotRequest {
    string user_message = 1;
    string graph_context_json = 2; // Lightweight JSON of nodes/edges
    string execution_history_json = 3; // Graph execution thread history
    string copilot_chat_history_json = 4; // Previous chat messages
    string selected_node_id = 5;
    string selected_edge_json = 6;
    // Optional per-request copilot LLM overrides. Empty means "inherit": COPILOT_PROVIDER /
    // COPILOT_MODEL, falling back to the service default (LLM_PROVIDER / LLM_MODEL).
    string copilot_provider = 7;
    string copilot_model = 8;
    // Per-user credentials resolved server-side by Spring from the account database, as a
    // JSON object keyed by provider id:
    //   {"openai": {"api_key": "sk-...", "folder_id": ""}, "yandex": {...}}
    // One map (rather than a single key) because a graph resolves its provider per NODE:
    // node metadata beats graph config, so a single run can touch several providers.
    // Empty means "use the service settings" (the legacy config-based mode).
    string llm_credentials_json = 9;
    // "1" when llm.credentials.policy=REQUIRE: refuse the question instead of falling back
    // to the shared service key. Without it the copilot would be a hole in the policy.
    string require_user_key = 10;
}

message CopilotResponse {
    bool success = 1;
    string ai_response = 2;
    string error_message = 3;
    int32 total_tokens = 4;
    // "user" when the answer came from a personal key, "service" from the shared key.
    // Never carries a credential.
    string llm_billing = 5;
}

// ==========================================
// Model catalog Messages (UI suggestions)
// ==========================================

message ListLlmModelsRequest {
    string provider = 1; // Which provider to list models for
}

message LlmModel {
    string id = 1;   // Model id sent to the provider (e.g. "gpt-4o-mini")
    string label = 2; // Human-readable name; falls back to the id when unknown
}

message ListLlmModelsResponse {
    bool success = 1;
    repeated LlmModel models = 2;
    string source = 3;         // "live" when fetched from the provider, "curated" as a fallback
    string error_message = 4;  // Set when the live list failed and we fell back to curated
}

// ==========================================
// Service-wide LLM settings (UI honesty)
// ==========================================

message GetLlmSettingsRequest {}

message GetLlmSettingsResponse {
    string default_provider = 1;  // LLM_PROVIDER: what a node/graph without a provider resolves to
    string default_model = 2;     // the model that same default provider will use
    bool service_key_enabled = 3; // LLM_SERVICE_KEY_ENABLED: false = no path may spend the shared key
}

// ==========================================
// Execution cancellation Messages
// ==========================================

message CancelGraphExecutionRequest {
    string graph_id = 1;
    string thread_id = 2;
}

message CancelGraphExecutionResponse {
    bool cancelled = 1;   // True when a live execution was found and asked to stop
    string message = 2;
}
