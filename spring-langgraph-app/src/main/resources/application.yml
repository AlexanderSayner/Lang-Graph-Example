server:
  port: 9191
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${IS_SECURE_SERVER:false} # Set to true in production (requires HTTPS)
        same-site: lax

spring:
  application:
    name: spring-langgraph-app
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  session:
    store-type: redis
    redis:
      namespace: langgraph:sessions
      flush-mode: on_save
  security:
    user:
      name: dummy # Prevents default auto-generated password log

  graphql:
    http:
      enabled: true
    path: /graphql
    graphiql:
      enabled: true
      path: /graphiql
    websocket:
      path: /graphql/ws

  jackson:
    default-property-inclusion: non_null

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${SPRING_JDBC_URL:jdbc:postgresql://localhost:5432/your_database_name}
    username: ${SPRING_JDBC_USERNAME:langgraph}
    password: ${SPRING_JDBC_PASSWORD:langgraph_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      max-lifetime: 1800000
      idle-timeout: 600000
  flyway:
    enabled: true
    schemas: public,core,app
    default-schema: public
    url: ${POSTGRES_FLYWAY_URL:}
    user: ${SPRING_JDBC_USERNAME:}
    password: ${SPRING_JDBC_PASSWORD:}

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6380}
      timeout: 2000ms

  grpc:
    server:
      port: 9090
    client:
      channels:
        langgraph-service:
          address: ${LANGGRAPH_SERVICE_ADDRESS:localhost:50051}
          negotiation-type: PLAINTEXT
          enable-keep-alive: true
          keep-alive-time: 30s
          keep-alive-without-calls: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.sandbox.langgraph: DEBUG
    org.springframework.graphql: DEBUG
    org.springframework.boot.autoconfigure.graphql: DEBUG
    io.grpc: INFO
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

yandex:
  cloud:
    billing-account-id: ${YC_BILLING_ACCOUNT_ID:}
    serviceAccountKeyJson: ${YC_SA_KEY_JSON:}
