server:
  port: 9191
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${IS_SECURE_SERVER:false} # Set to true in production (requires HTTPS)
        same-site: lax

spring:
  application:
    name: spring-langgraph-app
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  session:
    # Redis-backed (spring-boot-starter-session-data-redis): the signed-in caller survives a
    # restart and every instance sees the same sessions. Boot 4 selects the store purely from
    # the classpath - spring.session.store-type no longer exists - so there is deliberately no
    # "store-type" here, and the Redis store properties now live under spring.session.data.*.
    # The cookie stays JSESSIONID: Boot maps server.servlet.session.cookie.* onto the serializer.
    data:
      redis:
        namespace: langgraph:sessions
        flush-mode: on_save
  security:
    user:
      name: dummy # Prevents default auto-generated password log

  graphql:
    http:
      enabled: true
    path: /graphql
    graphiql:
      enabled: true
      path: /graphiql
    websocket:
      path: /graphql/ws

  # Browser document uploads (POST /api/documents). Boot's defaults are 1 MB / 10 MB, which
  # would reject a perfectly ordinary spreadsheet before the service's own 8 MB cap ever ran;
  # the request limit is kept above the file limit so the FILE limit is what actually bites,
  # and a too-large file reaches DocumentService and gets a readable reason rather than a
  # Tomcat 500.
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:12MB}
      file-size-threshold: 0

  jackson:
    default-property-inclusion: non_null

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${SPRING_JDBC_URL:jdbc:postgresql://localhost:5432/your_database_name}
    username: ${SPRING_JDBC_USERNAME:langgraph}
    password: ${SPRING_JDBC_PASSWORD:langgraph_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      max-lifetime: 1800000
      idle-timeout: 600000
  flyway:
    enabled: true
    schemas: public,core,app
    default-schema: public
    url: ${POSTGRES_FLYWAY_URL:}
    user: ${SPRING_JDBC_USERNAME:}
    password: ${SPRING_JDBC_PASSWORD:}

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6380}
      timeout: 2000ms

  grpc:
    # Internal server only: the Python engine calls back into this port
    # (ToolService / JavaGraphProvider). Never expose it outside the cluster.
    server:
      port: 9090
    client:
      channels:
        langgraph-service:
          address: ${LANGGRAPH_SERVICE_ADDRESS:localhost:50051}
          negotiation-type: PLAINTEXT
          enable-keep-alive: true
          keep-alive-time: 30s
          keep-alive-without-calls: true

# B2B (backend-to-backend) gRPC facade - external.v1, its own port, its own auth.
# Deliberately NOT under spring.grpc.*: Spring gRPC serves a single native server
# (the internal one above), so the second server is built by B2bGrpcServerConfig.
b2b:
  grpc:
    enabled: ${B2B_GRPC_ENABLED:true}
    host: ${B2B_GRPC_HOST:*}
    port: ${B2B_GRPC_PORT:9091}
    max-inbound-message-size: 4MB
    shutdown-grace-period: 30s
    reflection:
      # Server reflection (grpcurl discovery) on the B2B port. Keep it off outside
      # development: it publishes the contract's shape to anyone who can reach the port.
      enabled: ${B2B_GRPC_REFLECTION_ENABLED:false}
    ssl:
      # Blank = plaintext, acceptable only while the port stays inside the cluster
      # (same arrangement as the internal Python channel). Anything reachable from
      # outside must set a bundle and preferably client-auth: REQUIRE (mTLS).
      bundle: ${B2B_GRPC_SSL_BUNDLE:}
      client-auth: ${B2B_GRPC_SSL_CLIENT_AUTH:NONE}
    security:
      # Service accounts. Credentials are stored as SHA-256 digests at runtime and
      # never logged. An entry with neither api-key nor api-key-sha256 is not an
      # error: it is skipped with a warning, so no B2B_API_KEY in the environment
      # boots the app with every B2B call rejected with UNAUTHENTICATED (secure by
      # default). A *broken* credential (bad digest, duplicate key) still fails
      # startup - see B2BServiceAccounts.
      clients:
        - client-id: ${B2B_CLIENT_ID:orchestra}
          tenant-id: ${B2B_TENANT_ID:orchestra}
          owner-id: ${B2B_OWNER_ID:}
          api-key: ${B2B_API_KEY:}
          api-key-sha256: ${B2B_API_KEY_SHA256:}
          allowed-methods: ["*"]
          # Graph scope: which graphs this account may build, run, read, cancel and
          # delete. Exact ids, entries ending in '*' as prefixes, or '*' for every
          # graph. '*' is the single-tenant convenience default - narrow it to a
          # tenant's graphs (e.g. "acme-*") before a second B2B tenant is onboarded,
          # because core.graphs carries no owner column to fall back on. An account
          # with no entry at all may touch no graph.
          allowed-graphs: ${B2B_ALLOWED_GRAPHS:*}
          allow-tenant-override: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.sandbox.langgraph: DEBUG
    org.springframework.graphql: DEBUG
    org.springframework.boot.autoconfigure.graphql: DEBUG
    io.grpc: INFO
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

yandex:
  cloud:
    billing-account-id: ${YC_BILLING_ACCOUNT_ID:}
    serviceAccountKeyJson: ${YC_SA_KEY_JSON:}

# Personal LLM API keys (table app.user_llm_credentials), AES-256-GCM encrypted at rest.
llm:
  credentials:
    # Base64 for exactly 32 bytes:  openssl rand -base64 32
    # Blank (the default) = personal keys are DISABLED: the save mutation is refused with an
    # actionable message and every run keeps using the shared service key, so the feature is
    # opt-in per deployment and nothing changes until this is set.
    # Back it up: losing it means stored keys are unrecoverable (users re-enter them).
    master-key: ${LLM_SECRET_MASTER_KEY:}
    # FALLBACK (default) - a signed-in user with no key for a provider runs on the shared
    #   service key; the run is reported as llmBilling="service" in the UI and logged by the
    #   engine as `billing=service`, so a subsidised run is visible but never fatal.
    # REQUIRE - the run (and the copilot) stops with "add your key" instead of spending the
    #   operator's credits. Switch for the future subscription tier.
    # PERSONAL_ONLY - REQUIRE for a signed-in user, plus a caller without a key is REFUSED at
    #   the API edge instead of being served from the shared one: an anonymous GraphQL request,
    #   or a B2B call that sent no llm_credentials_json (an integrator brings its own keys on
    #   the call - see B2B_INTEGRATION.md). Pair it with LLM_SERVICE_KEY_ENABLED=false on the
    #   Python service, which is the hard guarantee that no path can read the shared key.
    #   Inert while master-key is blank - fail open, like REQUIRE.
    policy: ${LLM_CREDENTIALS_POLICY:FALLBACK}

# Uploaded documents (table app.documents). `expires_at` is stamped at upload (+7 days) by
# DocumentService; the retention SWEEP below is what actually deletes the rows once it
# elapses. Before this sweep existed the deadline was enforced on read only - an expired
# reference resolved to NOT_FOUND but the bytes stayed in the table forever.
documents:
  retention:
    # Milliseconds between sweeps. 1 hour: an hour of extra disk for a document nobody asked
    # about again is nothing, and one pass an hour clears even a busy deployment. Raise it to
    # slow the sweep down; there is no switch to turn it off, because retention is a contract
    # and not an optimisation.
    sweep-interval-ms: ${DOCUMENT_SWEEP_INTERVAL_MS:3600000}
