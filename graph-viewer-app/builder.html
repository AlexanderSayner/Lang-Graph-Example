<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraph Builder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.10.1/dist/style.css">
    <style>
        html, body, #root { height: 100%; width: 100%; margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

        /* Top Bar */
        .top-bar {
            height: 50px; background: #fff; border-bottom: 1px solid #ddd; display: flex;
            align-items: center; padding: 0 20px; justify-content: space-between; z-index: 100;
        }
        .btn-save { background: #4caf50; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-back { background: transparent; color: #333; text-decoration: none; margin-right: 15px; border: 1px solid #ddd; padding: 6px 12px; border-radius: 4px; }
        .name-input {
            font-size: 16px; font-weight: bold; border: 1px solid #ddd; padding: 5px 10px;
            border-radius: 4px; background: #f9f9f9; margin-left: 10px;
        }

        /* Layout */
        .layout-wrapper { display: flex; flex-direction: column; height: 100%; }
        .main-content { display: flex; flex: 1; height: calc(100% - 270px); overflow: hidden; }

        /* Palette */
        .palette { width: 50px; background: #f9f9f9; border-right: 1px solid #ddd; padding: 10px 5px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .palette-node {
            width: 40px; height: 40px; background: #fff; border: 1px solid #ccc; border-radius: 8px;
            cursor: grab; display: flex; align-items: center; justify-content: center; font-size: 20px;
            transition: all 0.2s;
        }
        .palette-node:hover { border-color: #2196f3; }
        .palette-node.disabled { opacity: 0.4; cursor: not-allowed; background: #f0f0f0; }

        /* Canvas */
        .canvas-wrapper { flex-grow: 1; height: 100%; position: relative; background: #fff; }

        /* Bottom Panel */
        .bottom-panel { height: 220px; background: #fff; border-top: 1px solid #ddd; padding: 15px 30px; display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
        .panel-header { font-size: 14px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-delete { background: #ff4d4f; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }

        .form-row { display: flex; gap: 20px; margin-bottom: 10px; }
        .form-group { flex: 1; }
        .form-label { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 4px; display: block; }
        .form-input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        .form-textarea { height: 60px; resize: none; }
        .form-select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; background: white; }

        /* Nodes */
        .react-flow__node { padding: 0; border-radius: 6px; width: 160px; font-size: 12px; text-align: center; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .node-start { background: #e8f5e9; border-color: #4caf50; }
        .node-end { background: #ffebee; border-color: #f44336; }
        .node-action { background: #e3f2fd; border-color: #2196f3; }
        .node-human { background: #fff3e0; border-color: #ff9800; }
        .node-graph { background: #f3e5f5; border-color: #9c27b0; border-style: dashed; }

        .node-label { padding: 10px; font-weight: bold; }
        .node-type { font-size: 10px; opacity: 0.8; font-weight: normal; display: block; margin-top: 2px; }
    </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reactflow@11.10.1/dist/umd/index.js"></script>

<script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;
    const {
        ReactFlow, Controls, Background, addEdge, useNodesState, useEdgesState,
        MarkerType, Handle, Position, useReactFlow, ReactFlowProvider
    } = window.ReactFlow;

    // --- Config & Helpers ---
    const API_URL = "http://localhost:9191/graphql";
    const params = new URLSearchParams(window.location.search);
    const IS_NEW = params.get('isNew') === 'true';
    const URL_ID = params.get('graphId');
    const URL_NAME = params.get('graphName');

    const fetchGraphQL = async (query, variables) => {
        const res = await fetch(API_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, variables })
        });
        const json = await res.json();
        if (json.errors) throw new Error(json.errors[0].message);
        return json.data;
    };

    // --- Custom Node ---
    const DesignNode = ({ data, selected }) => {
        let bgClass = 'node-action';
        if (data.type === 'START') bgClass = 'node-start';
        if (data.type === 'END') bgClass = 'node-end';
        if (data.type === 'HUMAN') bgClass = 'node-human';
        if (data.type === 'GRAPH') bgClass = 'node-graph';

        return (
            <div className={`react-flow__node ${bgClass}`} style={{ borderWidth: selected ? 3 : 2 }}>
                {data.type !== 'START' && <Handle type="target" position={Position.Top} style={{ background: '#555' }} />}
                <div className="node-label">
                    {data.label}
                    <span className="node-type">{data.type}</span>
                </div>
                {data.type !== 'END' && <Handle type="source" position={Position.Bottom} style={{ background: '#555' }} />}
            </div>
        );
    };
    const nodeTypes = { designNode: DesignNode };

    // --- Builder ---
    function Builder() {
        const [nodes, setNodes, onNodesChange] = useNodesState([]);
        const [edges, setEdges, onEdgesChange] = useEdgesState([]);
        const [selectedElement, setSelectedElement] = useState(null);
        const [loading, setLoading] = useState(false);

        // State for available graphs to link
        const [availableGraphs, setAvailableGraphs] = useState([]);

        const [graphId, setGraphId] = useState(IS_NEW ? `graph-${Date.now()}` : URL_ID);
        const [graphName, setGraphName] = useState(URL_NAME || "Untitled Graph");

        const reactFlowWrapper = useRef(null);
        const { project } = useReactFlow();

        // Check if Start Node already exists
        const hasStartNode = nodes.some(n => n.data.type === 'START');

        // Init
        useEffect(() => {
            // Load available graphs for the dropdown
            const LIST_QUERY = `query { listGraphs(pageSize: 100) { graphs { graphId graphName } } }`;
            fetchGraphQL(LIST_QUERY).then(data => {
                // Filter out the current graph to prevent self-reference
                const others = data.listGraphs.graphs.filter(g => g.graphId !== graphId);
                setAvailableGraphs(others);
            }).catch(console.error);

            // Load current graph if editing
            if (IS_NEW) {
                setNodes([]);
            } else if (URL_ID) {
                const Q = `query Get($id: String!) { getGraphView(graphId: $id) { nodes { nodeId nodeType metadata position { x y } } edges { source target condition } } }`;
                fetchGraphQL(Q, { id: URL_ID }).then(data => {
                    if (!data.getGraphView) return;
                    setNodes(data.getGraphView.nodes.map(n => ({
                        id: n.nodeId, type: 'designNode', position: n.position || { x: 0, y: 0 },
                        data: {
                            label: n.nodeId,
                            type: n.nodeType,
                            prompt: n.metadata?.system_prompt || "",
                            subgraphId: n.metadata?.subgraph_id || null // Load subgraph ID
                        }
                    })));
                    setEdges(data.getGraphView.edges.map((e, i) => ({
                        id: `e-${i}`, source: e.source, target: e.target,
                        label: e.condition || '', animated: true, markerEnd: { type: MarkerType.ArrowClosed }
                    })));
                });
            }
        }, []);

        // --- Interaction ---

        const onConnect = useCallback((params) => {
            setEdges(eds => addEdge({ ...params, type: 'default', animated: true, markerEnd: { type: MarkerType.ArrowClosed }, label: '' }, eds));
        }, []);

        const onDragStart = (e, type) => {
            if (type === 'START' && hasStartNode) return; // Prevent dragging
            e.dataTransfer.setData('application/reactflow', type);
            e.dataTransfer.effectAllowed = 'move';
        };

        const onDragOver = useCallback((e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }, []);

        const onDrop = useCallback((e) => {
            e.preventDefault();
            const type = e.dataTransfer.getData('application/reactflow');
            if (!type) return;

            if (type === 'START' && hasStartNode) {
                alert("Only one Start node allowed.");
                return;
            }

            const bounds = reactFlowWrapper.current.getBoundingClientRect();
            const position = project({ x: e.clientX - bounds.left, y: e.clientY - bounds.top });

            const id = `node_${Date.now()}`;
            setNodes(nds => nds.concat({
                id, type: 'designNode', position,
                data: { label: id, type: type, prompt: "", subgraphId: null }
            }));
        }, [hasStartNode]);

        const onElementClick = (e, el) => setSelectedElement(el);

        // --- Deletion ---
        const deleteSelected = () => {
            if (!selectedElement) return;
            if (window.confirm(`Delete ${selectedElement.type === 'designNode' ? 'Node' : 'Edge'}?`)) {
                if (selectedElement.type === 'designNode') {
                    setNodes(nds => nds.filter(n => n.id !== selectedElement.id));
                    setEdges(eds => eds.filter(e => e.source !== selectedElement.id && e.target !== selectedElement.id));
                } else {
                    setEdges(eds => eds.filter(e => e.id !== selectedElement.id));
                }
                setSelectedElement(null);
            }
        };

        // --- Save Logic ---

        const handleSave = async () => {
            if (!graphName.trim()) { alert("Please enter a graph name."); return; }
            setLoading(true);
            try {
                if (!nodes.find(n => n.data.type === 'START')) throw new Error("Graph needs a START node");
                if (!nodes.find(n => n.data.type === 'END')) throw new Error("Graph needs an END node");

                const payloadNodes = nodes.map(n => {
                    const meta = { system_prompt: n.data.prompt || "" };
                    // Add subgraph_id if it's a GRAPH node
                    if (n.data.type === 'GRAPH' && n.data.subgraphId) {
                        meta.subgraph_id = n.data.subgraphId;
                    }
                    return {
                        nodeId: n.id,
                        nodeType: n.data.type,
                        handlerName: `${n.id}Handler`,
                        metadata: meta
                    };
                });

                const payloadEdges = edges.map(e => ({
                    source: e.source, target: e.target, condition: e.label || null
                }));

                const BUILD_MUTATION = `mutation Build($input: BuildGraphInput!) { buildGraph(input: $input) { success } }`;
                await fetchGraphQL(BUILD_MUTATION, { input: { graphId: graphId, graphName: graphName, nodes: payloadNodes, edges: payloadEdges }});

                const LAYOUT_MUTATION = `mutation Save($gid: String!, $pos: [NodePositionInput!]!) { saveGraphCoordinates(graphId: $gid, positions: $pos) { success } }`;
                const positions = nodes.map(n => ({ nodeId: n.id, x: n.position.x, y: n.position.y }));
                await fetchGraphQL(LAYOUT_MUTATION, { gid: graphId, pos: positions });

                alert("Saved Successfully!");
                window.location.href = 'index.html';
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                setLoading(false);
            }
        };

        // --- Panel Updates ---

        const updateNode = (key, value) => {
            if (key === 'id') {
                const oldId = selectedElement.id;
                if (nodes.find(n => n.id === value)) { alert("ID already exists"); return; }
                setNodes(nds => nds.map(n => n.id === oldId ? {...n, id: value, data: {...n.data, label: value}} : n));
                setEdges(eds => eds.map(e => ({
                    ...e,
                    source: e.source === oldId ? value : e.source,
                    target: e.target === oldId ? value : e.target
                })));
                setSelectedElement(el => ({ ...el, id: value, data: {...el.data, label: value} }));
            } else {
                setNodes(nds => nds.map(n => n.id === selectedElement.id ? {...n, data: {...n.data, [key]: value}} : n));
                setSelectedElement(el => ({ ...el, data: {...el.data, [key]: value} }));
            }
        };

        const updateEdge = (value) => {
            setEdges(eds => eds.map(e => e.id === selectedElement.id ? {...e, label: value} : e));
            setSelectedElement(el => ({...el, label: value}));
        };

        return (
            <div className="layout-wrapper">
                <div className="top-bar">
                    <div style={{display: 'flex', alignItems: 'center'}}>
                        <a href="index.html" className="btn-back">← Back</a>
                        <h2>Editing:</h2>
                        <input className="name-input" value={graphName} onChange={(e) => setGraphName(e.target.value)} />
                    </div>
                    <button onClick={handleSave} className="btn-save" disabled={loading}>
                        {loading ? "Saving..." : "Save Graph"}
                    </button>
                </div>

                <div className="main-content">
                    <div className="palette">
                        <div
                            className={`palette-node ${hasStartNode ? 'disabled' : ''}`}
                            title="Start Node"
                            draggable={!hasStartNode}
                            onDragStart={(e) => onDragStart(e, 'START')}
                        >
                            🚀
                        </div>
                        <div className="palette-node" title="Action Node" draggable onDragStart={(e) => onDragStart(e, 'ACTION')}>🤖</div>
                        <div className="palette-node" title="Human Node" draggable onDragStart={(e) => onDragStart(e, 'HUMAN')}>👤</div>
                        <div className="palette-node" title="Subgraph Node" draggable onDragStart={(e) => onDragStart(e, 'GRAPH')}>🧩</div>
                        <div className="palette-node" title="End Node" draggable onDragStart={(e) => onDragStart(e, 'END')}>🛑</div>
                    </div>

                    <div className="canvas-wrapper" ref={reactFlowWrapper} onDrop={onDrop} onDragOver={onDragOver}>
                        <ReactFlow
                            nodes={nodes}
                            edges={edges}
                            onNodesChange={onNodesChange}
                            onEdgesChange={onEdgesChange}
                            onConnect={onConnect}
                            onNodeClick={onElementClick}
                            onEdgeClick={onElementClick}
                            nodeTypes={nodeTypes}
                            defaultViewport={{ x: 0, y: 0, zoom: 1.0 }}
                            snapToGrid={true}
                            snapGrid={[10, 10]}
                            deleteKeyCode={['Backspace', 'Delete']}
                        >
                            <Background gap={10} size={1} />
                            <Controls />
                        </ReactFlow>
                    </div>
                </div>

                <div className="bottom-panel">
                    {selectedElement ? (
                        <>
                            <div className="panel-header">
                                <span>{selectedElement.type === 'designNode' ? `Node: ${selectedElement.id}` : `Edge`}</span>
                                <button className="btn-delete" onClick={deleteSelected}>Delete</button>
                            </div>

                            {selectedElement.type === 'designNode' ? (
                                <div className="form-row">
                                    <div className="form-group">
                                        <label className="form-label">Node ID</label>
                                        <input className="form-input" value={selectedElement.id} onChange={(e) => updateNode('id', e.target.value)} />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Type</label>
                                        <input className="form-input" value={selectedElement.data.type} disabled />
                                    </div>

                                    {/* Conditional Rendering for Specific Types */}
                                    {selectedElement.data.type === 'GRAPH' ? (
                                        <div className="form-group" style={{flex: 2}}>
                                            <label className="form-label">Link to Subgraph</label>
                                            <select
                                                className="form-select"
                                                value={selectedElement.data.subgraphId || ""}
                                                onChange={(e) => updateNode('subgraphId', e.target.value)}
                                            >
                                                <option value="" disabled>-- Select a Graph --</option>
                                                {availableGraphs.map(g => (
                                                    <option key={g.graphId} value={g.graphId}>{g.graphName} ({g.graphId})</option>
                                                ))}
                                            </select>
                                        </div>
                                    ) : (
                                        <div className="form-group" style={{flex: 2}}>
                                            <label className="form-label">System Prompt</label>
                                            <textarea className="form-input form-textarea" value={selectedElement.data.prompt || ""} onChange={(e) => updateNode('prompt', e.target.value)} />
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="form-row">
                                    <div className="form-group">
                                        <label className="form-label">Condition</label>
                                        <input className="form-input" value={selectedElement.label || ""} onChange={(e) => updateEdge(e.target.value)} placeholder="e.g. intent == 'build'" />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Connection</label>
                                        <input className="form-input" value={`${selectedElement.source} ➔ ${selectedElement.target}`} disabled />
                                    </div>
                                </div>
                            )}
                        </>
                    ) : (
                        <div style={{color: '#999', display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%'}}>
                            Select a node or edge to edit. Press DEL to remove.
                        </div>
                    )}
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ReactFlowProvider><Builder /></ReactFlowProvider>);
</script>
</body>
