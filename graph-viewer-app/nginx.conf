server {
    listen 80;
    server_name localhost;

    # GraphQL API proxy. Without it /graphql falls through to the SPA fallback below and the
    # frontend receives index.html ("<!DOCTYPE ...") instead of JSON.
    location /graphql {
        proxy_pass http://spring-service:9191/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;
        proxy_read_timeout 300s;
    }

    # Handle Vite static assets (they have hashed names, so cache them forever)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Main fallback for SPA routing
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
