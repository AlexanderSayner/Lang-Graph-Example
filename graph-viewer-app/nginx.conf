server {
    listen 80;
    server_name localhost;

    # Handle Vite static assets (they have hashed names, so cache them forever)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Main fallback for SPA routing
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
