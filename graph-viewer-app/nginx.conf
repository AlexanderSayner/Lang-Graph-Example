server {
    listen 80;
    server_name localhost;

    # GraphQL API proxy. Without it /graphql falls through to the SPA fallback below and the
    # frontend receives index.html ("<!DOCTYPE ...") instead of JSON.
    location /graphql {
        proxy_pass http://spring-service:9191/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;
        proxy_read_timeout 300s;
    }

    # REST document uploads (multipart). Separate from /graphql because the payload is binary:
    # base64-in-JSON would inflate every upload by a third and hit the GraphQL message limit.
    # client_max_body_size MUST be raised - nginx defaults to 1 MB, which would reject an
    # ordinary spreadsheet with a 413 before the application's own cap ever ran.
    location /api/ {
        proxy_pass http://spring-service:9191/api/;
        proxy_http_version 1.1;
        client_max_body_size 12m;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Handle Vite static assets (they have hashed names, so cache them forever)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Main fallback for SPA routing
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
