<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraph Studio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.10.1/dist/style.css">
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background: #f0f2f5; }

        #root { display: flex; width: 100%; height: 100%; }

        /* --- Sidebar --- */
        .sidebar {
            width: 320px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            position: relative;
            z-index: 10;
        }
        .sidebar.collapsed { width: 60px; }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #eee;
            background: #fafafa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
            box-sizing: border-box;
        }
        .sidebar-header h3 { margin: 0; color: #333; font-size: 16px; white-space: nowrap; overflow: hidden; }
        .sidebar.collapsed .sidebar-header h3 { display: none; }

        .toggle-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: #666; padding: 5px; }

        .graph-list { flex-grow: 1; overflow-y: auto; overflow-x: hidden; }

        .graph-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .graph-item:hover { background: #f5f5f5; }
        .graph-item.active { background: #e3f2fd; border-left: 4px solid #2196f3; }

        .sidebar.collapsed .graph-item { padding: 12px; justify-content: center; }
        .sidebar.collapsed .graph-item.active { padding-left: 12px; border-left-width: 4px; }

        .graph-info { flex-grow: 1; margin-right: 10px; overflow: hidden; }
        .sidebar.collapsed .graph-info { display: none; }

        .graph-item .name { font-weight: 600; color: #333; font-size: 13px; }
        .graph-item .meta { font-size: 10px; color: #888; margin-top: 2px; }

        .graph-icon-mini { display: none; width: 8px; height: 8px; border-radius: 50%; background: #2196f3; }
        .sidebar.collapsed .graph-icon-mini { display: block; }

        .delete-btn { background: transparent; border: 1px solid #e0e0e0; color: #999; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; }
        .sidebar.collapsed .delete-btn { display: none; }
        .delete-btn:hover { background: #ffebee; color: #c62828; }

        /* --- Main Content Area --- */
        .main-area { flex-grow: 1; display: flex; flex-direction: column; height: 100%; position: relative; }

        /* --- Graph Canvas --- */
        .canvas-container { flex-grow: 1; position: 'relative'; background: #fff; border-bottom: 1px solid #ddd; }

        /* --- Nodes --- */
        .react-flow__node { font-size: 12px; border-radius: 8px; padding: 0; width: 220px; text-align: left; border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 2px 6px rgba(0,0,0,0.1); background: #fff; transition: box-shadow 0.2s, border-color 0.2s; }

        .react-flow__node.node-start { background: #e8f5e9; border-color: #c8e6c9; }
        .react-flow__node.node-end { background: #ffebee; border-color: #ffcdd2; }
        .react-flow__node.node-action { background: #e3f2fd; border-color: #bbdefb; }
        .react-flow__node.node-human { background: #fff3e0; border-color: #ffe0b2; }
        .react-flow__node.node-graph { background: #f3e5f5; border-color: #e1bee7; border-style: dashed; }
        .react-flow__node.node-tool { background: #e0f2f1; border-color: #80cbc4; }

        /* Visual Path Tracing - Active State */
        .react-flow__node.node-active-path {
            border-color: #4caf50 !important;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3), 0 4px 12px rgba(76, 175, 80, 0.2);
        }
        /* Purple highlight for the rewind origin node only - THINNER FRAME */
        .react-flow__node.node-rewind-origin {
            border-color: #9c27b0 !important;  /* Material purple */
            border-width: 2px !important;       /* 👈 Thinner border */
            box-shadow: 0 0 0 2px rgba(156, 39, 176, 0.25);  /* 👈 Subtler shadow */
            /* Removed pulse animation for cleaner look */
        }

        /* Keep smooth transitions */
        .react-flow__node {
            transition: border-color 0.2s ease, box-shadow 0.2s ease, border-width 0.2s ease;
        }

        .node-header { padding: 8px 12px; border-bottom: 1px solid rgba(0,0,0,0.05); font-weight: bold; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .node-start .node-header { color: #2e7d32; }
        .node-end .node-header { color: #c62828; }
        .node-action .node-header { color: #1565c0; }
        .node-human .node-header { color: #ef6c00; }
        .node-graph .node-header { color: #7b1fa2; }
        .node-tool .node-header { color: #00695c; }

        .node-type-badge { font-size: 9px; background: rgba(255,255,255,0.6); padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: normal; }

        .node-body { padding: 8px 12px; max-height: 80px; overflow-y: auto; background: rgba(255,255,255,0.3); }
        .node-body:empty { display: none; }
        .node-prompt { font-size: 10px; color: #444; line-height: 1.4; }

        .subgraph-link { display: block; margin-top: 8px; font-size: 10px; color: #7b1fa2; background: rgba(255,255,255,0.5); padding: 4px 8px; border-radius: 4px; text-decoration: none; text-align: center; border: 1px solid #ce93d8; cursor: pointer; }
        .subgraph-link:hover { background: #e1bee7; color: #4a148c; }

        /* --- Chat Panel --- */
        .chat-panel {
            min-height: 150px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            border-top: 1px solid #ddd;
        }

        /* Custom Resizer */
        .resizer {
            height: 6px;
            background: #eee;
            cursor: ns-resize;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .resizer::after { content: ''; width: 30px; height: 3px; background: #ccc; border-radius: 2px; }
        .resizer:hover { background: #e0e0e0; }

        /* Tabs */
        .chat-tabs { display: flex; background: #fff; border-bottom: 1px solid #eee; flex-shrink: 0; }
        .chat-tab { padding: 10px 20px; cursor: pointer; font-size: 12px; font-weight: 600; color: #666; border-bottom: 2px solid transparent; }
        .chat-tab.active { color: #2196f3; border-bottom-color: #2196f3; }
        .chat-tab:hover { background: #f5f5f5; }

        .chat-messages { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }

        .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .msg-user { align-self: flex-end; background: #2196f3; color: white; }
        .msg-bot { align-self: flex-start; background: white; border: 1px solid #e0e0e0; color: #333; }
        .msg-error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; font-size: 11px; }

        /* History List */
        .history-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .history-item { background: white; border: 1px solid #e0e0e0; padding: 10px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .history-item:hover { background: #f5f5f5; border-color: #bdbdbd; }
        .history-node-name { font-weight: bold; font-size: 13px; color: #333; }
        .history-timestamp { font-size: 10px; color: #999; }

        .history-actions { display: flex; gap: 5px; align-items: center; }

        .chat-input-area { padding: 10px; background: #fff; display: flex; gap: 10px; border-top: 1px solid #eee; flex-shrink: 0; }

        .chat-input { flex-grow: 1; border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; font-size: 13px; outline: none; }
        .chat-input:focus { border-color: #2196f3; }

        .send-btn { background: #2196f3; color: white; border: none; padding: 0 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .send-btn:disabled { background: #ccc; }

        .save-layout-btn { position: absolute; top: 10px; right: 10px; z-index: 5; background: white; border: 1px solid #ccc; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        .copy-btn-icon { margin-left: 5px; cursor: pointer; opacity: 0.7; font-size: 12px; }
        .copy-btn-icon:hover { opacity: 1; }
        .icon-btn { background: transparent; border: none; cursor: pointer; font-size: 14px; padding: 0 5px; opacity: 0.6; }
        .icon-btn:hover { opacity: 1; }

        /* --- Modal Styles --- */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 80%; height: 80%; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .modal-title { font-size: 16px; font-weight: bold; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #666; }
        .modal-body { flex-grow: 1; overflow: auto; background: #f8f9fa; border-radius: 4px; padding: 10px; position: relative; }
        .json-viewer { white-space: pre-wrap; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; color: #333; }

        .btn-rewind { background: #ff9800; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 10px; }
        .btn-rewind:hover { background: #f57c00; }
    </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reactflow@11.10.1/dist/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>

<script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { ReactFlow, Background, Controls, MarkerType, useNodesState, useEdgesState } = window.ReactFlow;

    // --- Config ---
    const API_URL = "http://localhost:9191/graphql";

    // --- Helpers ---
    const fetchGraphQL = async (query, variables) => {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, variables })
        });
        const json = await response.json();
        if (json.errors) throw new Error(json.errors[0].message);
        return json.data;
    };

    // --- Queries ---
    const LIST_QUERY = `query { listGraphs(pageSize: 100) { graphs { graphId graphName nodeCount } } }`;
    const VIEW_QUERY = `query Get($graphId: String!) { getGraphView(graphId: $graphId) { nodes { nodeId nodeType metadata position { x y } } edges { source target condition } } }`;

    const HISTORY_QUERY = `query History($graphId: String!, $threadId: String!) {
        getExecutionHistory(graphId: $graphId, threadId: $threadId) {
            success
            history {
                nodeId
                stateJson
                timestamp
                diff {
                    added
                    removed
                    modified
                    summary
                }
            }
            errorMessage
        }
    }`;

    const EXECUTE_MUTATION = `
        mutation Exec($input: ExecuteGraphInput!) {
            executeGraph(input: $input) {
                output
                eventType
                state
                errorMessage
            }
        }`;

    const SAVE_MUTATION = `mutation Save($graphId: String!, $positions: [NodePositionInput!]!) { saveGraphCoordinates(graphId: $graphId, positions: $positions) { success } }`;
    const DELETE_MUTATION = `mutation Del($graphId: String!) { deleteGraph(graphId: $graphId) { success } }`;

    const REWIND_MUTATION = `
        mutation Rewind($graphId: String!, $threadId: String!, $stateJson: String!) {
            rewindGraph(graphId: $graphId, threadId: $threadId, stateJson: $stateJson) { success message }
        }
    `;

    // --- Layout Logic ---
    const layoutGraph = (nodes, edges) => {
        const g = new dagre.graphlib.Graph();
        g.setGraph({ rankdir: 'TB', nodesep: 150, ranksep: 120 });
        g.setDefaultEdgeLabel(() => ({}));
        nodes.forEach(n => g.setNode(n.id, { width: 220, height: 80 }));
        edges.forEach(e => g.setEdge(e.source, e.target));
        dagre.layout(g);
        return nodes.map(n => {
            const pos = g.node(n.id);
            return { ...n, position: { x: pos.x - 110, y: pos.y - 40 } };
        });
    };

    // --- Main App ---
    function App() {
        const [graphs, setGraphs] = useState([]);
        const [selected, setSelected] = useState(null);
        const [collapsed, setCollapsed] = useState(false);

        const [nodes, setNodes, onNodesChange] = useNodesState([]);
        const [edges, setEdges, onEdgesChange] = useEdgesState([]);

        const [messages, setMessages] = useState([]);
        const [input, setInput] = useState("");
        const [threadId, setThreadId] = useState(Date.now().toString());
        const [loading, setLoading] = useState(false);
        const chatEndRef = useRef(null);

        const [activeTab, setActiveTab] = useState('chat');
        const [historyItems, setHistoryItems] = useState([]);

        const [modalViewMode, setModalViewMode] = useState('diff'); // 'diff' | 'full

        const [graphStatus, setGraphStatus] = useState('idle'); // Values: 'idle' | 'running' | 'waiting' | 'finished'

        // Map for NodeID -> Friendly Name
        const [nodeLabels, setNodeLabels] = useState({});

        // Copy States
        const [copiedThread, setCopiedThread] = useState(false);
        const [copiedGraph, setCopiedGraph] = useState(false);

        // Modal State
        const [modalData, setModalData] = useState(null);

        // Visual Path Tracing State
        const [activeNodeIds, setActiveNodeIds] = useState(new Set());
        // Track which node we rewound from (for purple highlighting)
        const [rewindOriginNodeId, setRewindOriginNodeId] = useState(null);

        // --- Custom Resizer State ---
        const [panelHeight, setPanelHeight] = useState(300);
        const panelRef = useRef(null);
        const isResizing = useRef(false);

        // Resizer Handlers
        const startResizing = useCallback((e) => {
            e.preventDefault();
            isResizing.current = true;
            document.addEventListener('mousemove', stopResizing);
            document.addEventListener('mouseup', stopResizing);
        }, []);

        const stopResizing = useCallback((e) => {
            if (!isResizing.current) return;

            // Calculate new height based on mouse position relative to window bottom
            const newHeight = window.innerHeight - e.clientY;
            if (newHeight >= 150 && newHeight <= 800) setPanelHeight(newHeight);
            else if (newHeight < 150) setPanelHeight(150);
            else setPanelHeight(800);

            // Clamp height between min and max
            if (newHeight >= 150 && newHeight <= 800) {
                setPanelHeight(newHeight);
            } else if (newHeight < 150) {
                setPanelHeight(150);
            } else {
                setPanelHeight(800);
            }

            // Cleanup
            if (e.type === 'mouseup') {
                isResizing.current = false;
                document.removeEventListener('mousemove', stopResizing);
                document.removeEventListener('mouseup', stopResizing);
            }
        }, []);

        // Load Graph List
        useEffect(() => {
            fetchGraphQL(LIST_QUERY).then(d => setGraphs(d.listGraphs.graphs)).catch(console.error);
        }, []);

        // Scroll chat to bottom
        useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

        // Load History
        useEffect(() => {
            if (activeTab === 'history' && selected && threadId) loadHistory();
        }, [activeTab, selected, threadId]);

        const loadHistory = async () => {
            try {
                const data = await fetchGraphQL(HISTORY_QUERY, {
                    graphId: selected,
                    threadId
                });

                if (data.getExecutionHistory.success) {
                    // Backend now returns history items with optional 'diff' field
                    setHistoryItems(data.getExecutionHistory.history);

                    // Visual Path Tracing: Calculate Active Nodes
                    const executedIds = new Set(
                        data.getExecutionHistory.history
                            .map(h => h.nodeId)
                            .filter(id => id && !id.startsWith("Pending"))
                    );
                    setActiveNodeIds(executedIds);

                } else {
                    console.error("History error:", data.getExecutionHistory.errorMessage);
                    setHistoryItems([]);
                    setActiveNodeIds(new Set());
                }
            } catch (err) {
                console.error("Failed to load history:", err);
                setHistoryItems([]);
                setActiveNodeIds(new Set());
            }
        };

        const loadGraph = (id) => {
            setSelected(id);
            setGraphStatus('idle');

            setActiveNodeIds(new Set());
            setRewindOriginNodeId(null);

            fetchGraphQL(VIEW_QUERY, { graphId: id }).then(d => {
                const view = d.getGraphView;

                // Create Label Map
                const labels = {};
                view.nodes.forEach(n => { if(n.metadata?.label) labels[n.nodeId] = n.metadata.label; });
                setNodeLabels(labels);

                // Map Backend Nodes to React Flow Nodes
                const rN = view.nodes.map(n => {
                    const hasPos = n.position && (n.position.x || n.position.y);
                    const prompt = n.metadata?.system_prompt || "";
                    const subgraphId = n.metadata?.subgraph_id;
                    const label = n.metadata?.label;
                    const toolUrl = n.metadata?.url || "";

                    const subgraphName = graphs.find(g => g.graphId === subgraphId)?.graphName || "Unknown Graph";

                    return {
                        id: n.nodeId,
                        className: `node-${n.nodeType.toLowerCase()}`,
                        data: {
                            label: (
                                <div>
                                    <div className="node-header">
                                        {/* Use Label if exists, else ID */}
                                        <span>{label || n.nodeId}</span>
                                        <span className="node-type-badge">{n.nodeType}</span>
                                    </div>

                                    <div className="node-body">
                                        {n.nodeType === 'GRAPH' ? (
                                            <div>
                                                <div style={{marginBottom: '5px'}}><strong>Subgraph:</strong><br/>{subgraphName}</div>
                                                <div className="subgraph-link" onClick={(e) => { e.stopPropagation(); if(subgraphId) loadGraph(subgraphId); }}>View Subgraph &rarr;</div>
                                            </div>
                                        ) : n.nodeType === 'TOOL' ? (
                                            <div>
                                                <strong>Tool:</strong> {n.metadata?.method || 'GET'}<br/>
                                                <span style={{fontSize: '9px', color: '#666'}}>{toolUrl}</span>
                                            </div>
                                        ) : (
                                            <div className="node-prompt">{prompt}</div>
                                        )}
                                    </div>
                                </div>
                            )
                        },
                        position: hasPos ? n.position : { x: 0, y: 0 }
                    };
                });

                const rE = view.edges.map((e, i) => ({
                    id: `e${i}`, source: e.source, target: e.target,
                    label: e.condition,
                    animated: true,
                    markerEnd: { type: MarkerType.ArrowClosed }
                }));

                const needsLayout = rN.every(n => n.position.x === 0 && n.position.y === 0);
                setNodes(needsLayout ? layoutGraph(rN, rE) : rN);
                setEdges(rE);
            });
        };

        // Re-apply node styles when activeNodeIds changes OR when nodes are reset
        useEffect(() => {
            if (!nodes.length) return;

            setNodes(nds => {
                let changed = false;
                const updated = nds.map(n => {
                    const wasExecuted = activeNodeIds.has(n.id);
                    if (!wasExecuted) return n;

                    // Extract base class: look for node-{type} pattern (e.g., "node-action", "node-start")
                    const baseMatch = n.className?.match(/node-\w+/);
                    const baseClass = baseMatch ? baseMatch[0] : `node-${n.data?.label?.props?.children?.props?.children?.[0]?.props?.children?.type?.toLowerCase() || 'action'}`;

                    // Determine highlight class
                    // Purple ONLY for the rewind origin, green for everything else executed
                    const isRewindOrigin = (rewindOriginNodeId && n.id === rewindOriginNodeId);
                    const highlightClass = isRewindOrigin ? 'node-rewind-origin' : 'node-active-path';

                    const newClass = `${baseClass} ${highlightClass}`;

                    if (n.className !== newClass) {
                        changed = true;
                        return { ...n, className: newClass };
                    }
                    return n;
                });
                return changed ? updated : nds;
            });

            // Also update edges for visual path tracing
            setEdges(eds => {
                let changed = false;
                const updated = eds.map(e => {
                    const isActive = activeNodeIds.has(e.source) && activeNodeIds.has(e.target);
                    if (!isActive) return e;

                    // Purple edge only if it starts from the rewind origin
                    const isFromRewindOrigin = (rewindOriginNodeId && e.source === rewindOriginNodeId);
                    const strokeColor = isFromRewindOrigin ? '#9c27b0' : '#4caf50';

                    const newStyle = { stroke: strokeColor, strokeWidth: 2 };
                    const newMarker = { ...e.markerEnd, color: strokeColor };

                    if (JSON.stringify(e.style) !== JSON.stringify(newStyle) ||
                        e.markerEnd?.color !== newMarker.color) {
                        changed = true;
                        return { ...e, style: newStyle, markerEnd: newMarker };
                    }
                    return e;
                });
                return changed ? updated : eds;
            });
        }, [activeNodeIds, rewindOriginNodeId, nodes.length]); // Depend on nodes.length to trigger when nodes reset

        const handleExecute = async () => {
            if (!input.trim() || !selected) return;

            const userText = input;
            setMessages(prev => [...prev, { type: 'user', text: userText }]);
            setInput("");
            setLoading(true);

            try {
                const data = await fetchGraphQL(EXECUTE_MUTATION, {
                    input: { graphId: selected, threadId: threadId, input: userText }
                });

                const result = data.executeGraph;
                let outputText = "Graph executed successfully.";
                let errorText = null;
                let eventType = null;

                if (Array.isArray(result)) {
                    const lastEvent = result[result.length - 1] || {};
                    outputText = lastEvent.state?.output || lastEvent.output || outputText;
                    errorText = lastEvent.errorMessage;
                    eventType = lastEvent.eventType;
                } else if (result) {
                    if (result.state && result.state.output) outputText = result.state.output;
                    else if (result.output) outputText = result.output;
                    errorText = result.errorMessage;
                    eventType = result.eventType;
                }

                if (errorText) setMessages(prev => [...prev, { type: 'error', text: errorText }]);
                else setMessages(prev => [...prev, { type: 'bot', text: outputText }]);

                if (eventType === 'END') {
                    setGraphStatus('finished');
                    if (rewindOriginNodeId) {
                        setRewindOriginNodeId(null);
                    }
                } else if (eventType === 'WAITING_FOR_INPUT') {
                    setGraphStatus('waiting');
                } else if (eventType === 'START' || eventType === 'NODE_END') {
                    setGraphStatus('running');
                }

                // Refresh history to update tracing
                await loadHistory();

            } catch (err) {
                setMessages(prev => [...prev, { type: 'error', text: "Error: " + err.message }]);
                setGraphStatus('idle');
            } finally {
                setLoading(false);
            }
        };

        const handleSaveLayout = async () => {
            if(!selected) return;
            const positions = nodes.map(n => ({ nodeId: n.id, x: n.position.x, y: n.position.y }));
            await fetchGraphQL(SAVE_MUTATION, { graphId: selected, positions });
            alert("Layout Saved!");
        };

        const handleDelete = async (e, id) => {
            e.stopPropagation();
            if(!window.confirm("Delete?")) return;
            await fetchGraphQL(DELETE_MUTATION, { graphId: id });
            setGraphs(prev => prev.filter(g => g.graphId !== id));
        };

        const resetThread = () => {
            setThreadId(Date.now().toString());
            setMessages([]);
            setHistoryItems([]);
            setActiveNodeIds(new Set());
            setGraphStatus('idle');
            setRewindOriginNodeId(null);
        };

        const copyThreadId = () => {
            navigator.clipboard.writeText(threadId).then(() => { setCopiedThread(true); setTimeout(() => setCopiedThread(false), 2000); });
        };

        const copyGraphId = (id) => {
            navigator.clipboard.writeText(id).then(() => { setCopiedGraph(id); setTimeout(() => setCopiedGraph(null), 2000); });
        };

        const formatTimestamp = (ts) => { try { return new Date(ts).toLocaleString(); } catch { return ts; } };

        // Use Labels in History
        const getNodeDisplayName = (id) => {
            if (!id) return "Start";
            if (id.startsWith("Pending:")) {
                const match = id.match(/'([^']+)'/);
                const nodeId = match ? match[1] : id;
                return `Next: ${nodeLabels[nodeId] || nodeId}`;
            }
            return nodeLabels[id] || id;
        };

        // --- Rewind Logic ---
        const handleRewind = async (stateJson, nodeId) => {
            if (!window.confirm("Rewind to this state? You can then send a new message to continue from here.")) return;

            try {
                console.log("Rewinding with state:", stateJson);
                const data = await fetchGraphQL(REWIND_MUTATION, {
                    graphId: selected,
                    threadId: threadId,
                    stateJson: JSON.stringify(stateJson)
                });

                if(data.rewindGraph.success) {
                    alert("State rewound. Switching to Chat.");
                    setModalData(null);
                    setActiveTab('chat');
                    setInput("Continue from previous step.");
                    setRewindOriginNodeId(nodeId);
                } else {
                    alert("Rewind failed: " + data.rewindGraph.message);
                }
            } catch (e) {
                alert("Error: " + e.message);
            }
        };

        // Helper: Render concise diff summary for history list
        const renderDiffSummary = (diff) => {
            if (!diff?.summary?.length) return null;

            return (
                <div style={{ fontSize: '11px', color: '#666', marginTop: '4px', lineHeight: '1.3' }}>
                    {diff.summary.slice(0, 2).map((item, i) => {
                        let icon = '';
                        let color = '#666';

                        if (item.includes('added')) {
                            icon = '➕ ';
                            color = '#2e7d32';
                        } else if (item.includes('removed')) {
                            icon = '➖ ';
                            color = '#c62828';
                        } else if (item.includes('modified')) {
                            icon = '✏️ ';
                            color = '#1565c0';
                        }

                        return (
                            <div key={i} style={{ color }}>
                                {icon}{item}
                            </div>
                        );
                    })}
                    {diff.summary.length > 2 && (
                        <div style={{ fontStyle: 'italic', color: '#999' }}>
                            +{diff.summary.length - 2} more
                        </div>
                    )}
                </div>
            );
        };

        // Helper: Render detailed diff view in modal
        const renderDiffDetails = (diff, fullJson) => {
            // Fallback to full JSON if no diff or in full view mode
            if (!diff || Object.keys(diff.added || {}).length === 0 &&
                (diff.removed || []).length === 0 &&
                Object.keys(diff.modified || {}).length === 0) {
                return <pre className="json-viewer">{JSON.stringify(fullJson, null, 2)}</pre>;
            }

            return (
                <div style={{ fontFamily: 'Consolas, Monaco, monospace', fontSize: '11px', lineHeight: '1.4' }}>
                    {/* Added fields */}
                    {diff.added && Object.keys(diff.added).length > 0 && (
                        <div style={{ marginBottom: '12px' }}>
                            <strong style={{ color: '#2e7d32', display: 'block', marginBottom: '4px' }}>
                                ➕ Added
                            </strong>
                            <pre style={{
                                background: '#e8f5e9',
                                padding: '8px',
                                borderRadius: '4px',
                                margin: 0,
                                whiteSpace: 'pre-wrap',
                                overflow: 'auto',
                                maxHeight: '150px'
                            }}>
                        {JSON.stringify(diff.added, null, 2)}
                    </pre>
                        </div>
                    )}

                    {/* Removed fields */}
                    {diff.removed && diff.removed.length > 0 && (
                        <div style={{ marginBottom: '12px' }}>
                            <strong style={{ color: '#c62828', display: 'block', marginBottom: '4px' }}>
                                ➖ Removed
                            </strong>
                            <ul style={{ margin: '4px 0 0 20px', padding: 0 }}>
                                {diff.removed.map((path, i) => (
                                    <li key={i} style={{ color: '#c62828', marginBottom: '2px' }}>
                                        {path}
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}

                    {/* Modified fields */}
                    {diff.modified && Object.keys(diff.modified).length > 0 && (
                        <div style={{ marginBottom: '12px' }}>
                            <strong style={{ color: '#1565c0', display: 'block', marginBottom: '4px' }}>
                                ✏️ Modified
                            </strong>
                            {Object.entries(diff.modified).map(([path, values]) => (
                                <div key={path} style={{
                                    background: '#e3f2fd',
                                    padding: '6px 8px',
                                    margin: '4px 0',
                                    borderRadius: '3px',
                                    borderLeft: '3px solid #2196f3'
                                }}>
                                    <div style={{ fontWeight: '600', marginBottom: '4px' }}>{path}</div>
                                    <div style={{ fontSize: '10px' }}>
                                        <span style={{ color: '#999' }}>Before: </span>
                                        <code style={{ background: '#ffebee', padding: '2px 4px', borderRadius: '2px' }}>
                                            {JSON.stringify(values?.old)}
                                        </code>
                                    </div>
                                    <div style={{ fontSize: '10px', marginTop: '2px' }}>
                                        <span style={{ color: '#999' }}>After: </span>
                                        <code style={{ background: '#e8f5e9', padding: '2px 4px', borderRadius: '2px' }}>
                                            {JSON.stringify(values?.new)}
                                        </code>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };


        return (
            <React.Fragment>
                {/* Modal */}
                {modalData && (
                    <div className="modal-overlay" onClick={() => {
                        setModalData(null);
                        setModalViewMode('diff'); // Reset on close
                    }}>
                        <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                            <div className="modal-header">
                                <div className="modal-title">
                                    State: <strong>{getNodeDisplayName(modalData.nodeId)}</strong>
                                    <span style={{fontWeight: 'normal', marginLeft: '10px', fontSize: '12px', color: '#666'}}>
                        {formatTimestamp(modalData.timestamp)}
                    </span>
                                </div>
                                <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                                    {/* Toggle buttons - only show if diff exists */}
                                    {modalData.diff && (
                                        <>
                                            <button
                                                onClick={() => setModalViewMode('diff')}
                                                style={{
                                                    padding: '4px 10px',
                                                    fontSize: '11px',
                                                    border: modalViewMode === 'diff' ? '2px solid #2196f3' : '1px solid #ccc',
                                                    background: modalViewMode === 'diff' ? '#e3f2fd' : '#fff',
                                                    borderRadius: '4px',
                                                    cursor: 'pointer',
                                                    color: modalViewMode === 'diff' ? '#1565c0' : '#666',
                                                    fontWeight: modalViewMode === 'diff' ? '600' : 'normal'
                                                }}
                                            >
                                                Diff
                                            </button>
                                            <button
                                                onClick={() => setModalViewMode('full')}
                                                style={{
                                                    padding: '4px 10px',
                                                    fontSize: '11px',
                                                    border: modalViewMode === 'full' ? '2px solid #2196f3' : '1px solid #ccc',
                                                    background: modalViewMode === 'full' ? '#e3f2fd' : '#fff',
                                                    borderRadius: '4px',
                                                    cursor: 'pointer',
                                                    color: modalViewMode === 'full' ? '#1565c0' : '#666',
                                                    fontWeight: modalViewMode === 'full' ? '600' : 'normal'
                                                }}
                                            >
                                                Full JSON
                                            </button>
                                        </>
                                    )}
                                    <button className="modal-close" onClick={() => {
                                        setModalData(null);
                                        setModalViewMode('diff');
                                    }}>&times;</button>
                                </div>
                            </div>
                            <div className="modal-body">
                                {modalViewMode === 'diff' && modalData.diff
                                    ? renderDiffDetails(modalData.diff, modalData.json)
                                    : <pre className="json-viewer">{JSON.stringify(modalData.json, null, 2)}</pre>
                                }
                            </div>
                            <div style={{padding: '10px', borderTop: '1px solid #eee', textAlign: 'right', display: 'flex', justifyContent: 'flex-end', gap: '8px'}}>
                                <button
                                    className="btn-rewind"
                                    onClick={() => handleRewind(modalData.json, modalData.nodeId)}
                                    style={{ fontSize: '12px', padding: '6px 12px' }}
                                >
                                    ↩️ Replay from here
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {/* Sidebar */}
                <div className={`sidebar ${collapsed ? 'collapsed' : ''}`}>
                    <div className="sidebar-header">
                        <a href="help.html" style={{textDecoration: 'none', color: 'inherit'}}><h3>LangGraph</h3></a>
                        <button onClick={() => window.location.href = 'builder.html?isNew=true'} style={{ background: '#2196f3', color: 'white', border: 'none', padding: '5px 10px', borderRadius: '4px', cursor: 'pointer', fontSize: '12px', marginRight: '10px' }}>+ New</button>
                        <button className="toggle-btn" onClick={() => setCollapsed(!collapsed)}>{collapsed ? '»' : '«'}</button>
                    </div>
                    <div className="graph-list">
                        {graphs.map(g => (
                            <div key={g.graphId} className={`graph-item ${g.graphId === selected ? 'active' : ''}`} onClick={() => loadGraph(g.graphId)}>
                                <div className="graph-icon-mini"></div>
                                <div className="graph-info">
                                    <div className="name">{g.graphName}</div>
                                    <div className="meta">{g.nodeCount} Nodes</div>
                                </div>

                                <div style={{ display: 'flex', gap: '5px', alignItems: 'center' }}>
                                    <button className="icon-btn" title="Copy ID" onClick={(e) => { e.stopPropagation(); copyGraphId(g.graphId); }}>{copiedGraph === g.graphId ? '✅' : '📋'}</button>
                                    <button style={{ background: 'transparent', border: '1px solid #2196f3', color: '#2196f3', padding: '4px 8px', borderRadius: '4px', cursor: 'pointer', fontSize: '10px', fontWeight: 'bold' }} onClick={(e) => { e.stopPropagation(); window.location.href = `builder.html?graphId=${g.graphId}&graphName=${g.graphName}`; }}>Edit</button>
                                    <button className="delete-btn" onClick={(e) => handleDelete(e, g.graphId)}>✕</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>

                {/* Main Content */}
                <div className="main-area">
                    <div className="canvas-container">
                        <button className="save-layout-btn" onClick={handleSaveLayout}>Save Layout</button>
                        <ReactFlow nodes={nodes} edges={edges} onNodesChange={onNodesChange} fitView>
                            <Background />
                            <Controls />
                        </ReactFlow>
                    </div>

                    {/* Chat Area */}
                    <div className="chat-panel" style={{ height: `${panelHeight}px` }} ref={panelRef}>

                        {/* The Resizer Handle */}
                        <div className="resizer" onMouseDown={startResizing}></div>

                        {/* Tabs Header */}
                        <div className="chat-tabs">
                            <div className={`chat-tab ${activeTab === 'chat' ? 'active' : ''}`} onClick={() => setActiveTab('chat')}>Chat</div>
                            <div className={`chat-tab ${activeTab === 'history' ? 'active' : ''}`} onClick={() => setActiveTab('history')}>History</div>
                            <div style={{flexGrow: 1}}></div>
                            <div style={{padding: '10px 15px', fontSize: '11px', color: '#999', display: 'flex', alignItems: 'center'}}>
                                {selected && ( <><span title={selected}>Graph: ...{selected.slice(-6)}</span><span className="copy-btn-icon" onClick={() => copyGraphId(selected)}>{copiedGraph === selected ? '✅' : '📋'}</span><span style={{margin: '0 8px', color: '#ddd'}}>|</span></> )}
                                <span title={threadId}>Thread: ...{threadId.slice(-6)}</span>
                                <span className="copy-btn-icon" onClick={copyThreadId}>{copiedThread ? '✅' : '📋'}</span>
                                <button onClick={resetThread} style={{border:'none', background:'none', cursor:'pointer', color:'#2196f3', marginLeft: '10px', fontSize: '11px'}}>New</button>
                            </div>
                        </div>

                        {/* Content Area */}
                        {activeTab === 'chat' ? (
                            <>
                                <div className="chat-messages">
                                    {graphStatus === 'finished' && (
                                        <div style={{
                                            padding: '8px 12px',
                                            background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                            color: 'white',
                                            textAlign: 'center',
                                            fontSize: '12px',
                                            fontWeight: '500',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            gap: '6px'
                                        }}>
                                            <span>✨</span>
                                            <span>Conversation completed</span>
                                            <button
                                                onClick={resetThread}
                                                style={{
                                                    background: 'rgba(255,255,255,0.2)',
                                                    border: '1px solid rgba(255,255,255,0.4)',
                                                    color: 'white',
                                                    padding: '4px 10px',
                                                    borderRadius: '12px',
                                                    fontSize: '11px',
                                                    cursor: 'pointer',
                                                    marginLeft: '8px',
                                                    transition: 'background 0.2s'
                                                }}
                                                onMouseOver={(e) => e.target.style.background = 'rgba(255,255,255,0.3)'}
                                                onMouseOut={(e) => e.target.style.background = 'rgba(255,255,255,0.2)'}
                                            >
                                                Start new thread →
                                            </button>
                                        </div>
                                    )}
                                    {messages.map((m, i) => ( <div key={i} className={`msg msg-${m.type}`}>{m.text}</div> ))}
                                    {loading && <div className="msg msg-bot">Thinking...</div>}
                                    <div ref={chatEndRef} />
                                </div>
                                <div className="chat-input-area">
                                    <input className="chat-input" placeholder={ graphStatus === 'finished' ? "💬 Graph finished — send a message to continue, or click 'New' for a fresh thread" : "Send message..." } value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleExecute()} disabled={loading} />
                                    <button className="send-btn" onClick={handleExecute} disabled={loading}>Send</button>
                                </div>
                            </>
                        ) : (
                            <div className="history-list">
                                {historyItems.length === 0 ? (
                                    <div style={{textAlign: 'center', color: '#999', marginTop: '20px'}}>
                                        No execution history for this thread.
                                    </div>
                                ) : (
                                    historyItems.map((h, idx) => (
                                        <div
                                            key={`${h.nodeId}-${idx}`}  // Unique key for React
                                            className="history-item"
                                            onClick={() => setModalData({
                                                nodeId: h.nodeId,
                                                timestamp: h.timestamp,
                                                json: h.stateJson,
                                                diff: h.diff  // Pass diff from backend
                                            })}
                                            style={{cursor: 'pointer'}}
                                        >
                                            <div style={{flex: 1, minWidth: 0}}>
                                                <div className="history-node-name" style={{
                                                    fontWeight: '600',
                                                    fontSize: '13px',
                                                    color: '#333',
                                                    marginBottom: '2px'
                                                }}>
                                                    {getNodeDisplayName(h.nodeId)}
                                                </div>
                                                <div className="history-timestamp" style={{
                                                    fontSize: '10px',
                                                    color: '#999'
                                                }}>
                                                    {formatTimestamp(h.timestamp)}
                                                </div>
                                                {/* NEW: Show diff summary */}
                                                {renderDiffSummary(h.diff)}
                                            </div>
                                            <div className="history-actions" style={{
                                                display: 'flex',
                                                gap: '8px',
                                                alignItems: 'center',
                                                flexShrink: 0
                                            }}>
                                                <button
                                                    className="btn-rewind"
                                                    style={{fontSize: '10px', padding: '4px 8px'}}
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        handleRewind(h.stateJson, h.nodeId);
                                                    }}
                                                >
                                                    Replay
                                                </button>
                                                <div style={{fontSize: '10px', color: '#2196f3'}}>
                                                    {h.diff?.summary?.length > 0 ? 'View Diff' : 'View JSON'}
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )
                        }
                    </div>
                </div>
            </React.Fragment>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
