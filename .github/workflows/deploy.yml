name: Build and Deploy to VPS

on:
  push:
    branches: [ "main" ]

# Required to push images to GitHub Container Registry
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alexandersayner/lang-graph-example

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------
      # 1️⃣ Checkout source
      # ------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2️⃣ Log in to GitHub Container Registry (GHCR)
      # ------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 3️⃣ Build & push Langgraph Service (Python)
      # ------------------------------------------------------------------
      - name: Build and push Langgraph Service
        uses: docker/build-push-action@v5
        with:
          context: ./python-langgraph-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/langgraph-service:latest

      # ------------------------------------------------------------------
      # 4️⃣ Build & push Spring Service (Java)
      # ------------------------------------------------------------------
      - name: Build and push Spring Service
        uses: docker/build-push-action@v5
        with:
          context: ./spring-langgraph-app
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/spring-service:latest

      # ------------------------------------------------------------------
      # 5. Build & push Graph Viewer App (Frontend)
      # ------------------------------------------------------------------
      - name: Build and push Graph Viewer App
        uses: docker/build-push-action@v5
        with:
          context: ./graph-viewer-app
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/graph-viewer-app:latest

      # ------------------------------------------------------------------
      # 6. Prepare Secrets (Base64 encode JSON to avoid shell escaping issues)
      # ------------------------------------------------------------------
      - name: Prepare Secrets
        id: prepare-secrets
        env:
          SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          SA_KEY_B64=$(echo -n "$SA_KEY_JSON" | base64 -w 0)
          echo "SA_KEY_B64=$SA_KEY_B64" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 6.4. Clean up specific deployment files on VPS to prevent conflicts
      # ------------------------------------------------------------------
      - name: Clean up VPS deployment files
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Explicitly remove only the files managed by our deployment
            rm -f /opt/myapp/docker-compose.yml
            rm -rf /opt/myapp/scripts

      # ------------------------------------------------------------------
      # 6.5. Copy docker-compose.yml and scripts to VPS
      # ------------------------------------------------------------------
      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,scripts"
          target: "/opt/myapp"
          overwrite: true

      # ------------------------------------------------------------------
      # 7. Deploy to VPS via SSH
      # ------------------------------------------------------------------
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/myapp
            
            echo "YC_API_KEY=${{ secrets.YC_API_KEY }}" > ~/myapp.env
            echo "YC_FOLDER_ID=${{ secrets.YC_FOLDER_ID }}" >> ~/myapp.env
            echo "YC_BILLING_ACCOUNT_ID=${{ secrets.YC_BILLING_ACCOUNT_ID }}" >> ~/myapp.env
            echo "YC_SA_KEY_JSON_B64=${{ steps.prepare-secrets.outputs.SA_KEY_B64 }}" >> ~/myapp.env
            echo "B2B_API_KEY=${{ secrets.B2B_API_KEY }}" >> ~/myapp.env
            # OpenRouter shared key. Runs whose graph selects llm_provider=openrouter and that
            # carry no personal llm_credentials_json (the B2B/orchestra path never does) run on
            # it, reported as llmBilling=service - without it the first model call fails with
            # "No API key for LLM provider 'openrouter'". Optional: an unset Secret expands to
            # an empty value, which is exactly the behaviour before this line existed.
            # docker-compose.yml forwards it (and OPENROUTER_MODEL) to langgraph-service.
            echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> ~/myapp.env
            # Personal LLM API keys. LLM_SECRET_MASTER_KEY MUST be a GitHub Secret and MUST be
            # STABLE: this file is rewritten on every deploy, so a key that lives only in a
            # shell or in ~/myapp.env would be lost here and every stored personal key would
            # become undecryptable (users would have to re-enter them). Back it up separately.
            # The policy and the engine's kill switch are not secrets -> repository variables;
            # `|| 'default'` keeps them at their default when the variable is unset.
            echo "LLM_SECRET_MASTER_KEY=${{ secrets.LLM_SECRET_MASTER_KEY }}" >> ~/myapp.env
            echo "LLM_CREDENTIALS_POLICY=${{ vars.LLM_CREDENTIALS_POLICY || 'FALLBACK' }}" >> ~/myapp.env
            echo "LLM_SERVICE_KEY_ENABLED=${{ vars.LLM_SERVICE_KEY_ENABLED || 'true' }}" >> ~/myapp.env
            
            chmod 600 ~/myapp.env
            
            # Log in to GitHub so the VPS can download the images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose --env-file ~/myapp.env pull
            # Recreate every application service. Naming a single service restricts `up`
            # to that service, so `... up -d --force-recreate spring-service` left
            # graph-viewer-app and langgraph-service running the previous release even
            # though `pull` had already fetched the new :latest images. postgres/redis are
            # deliberately not listed: they hold state and their config did not change.
            docker compose --env-file ~/myapp.env up -d --force-recreate spring-service langgraph-service graph-viewer-app

            # Verify the release actually landed: every application container must run the
            # image `pull` just fetched, not a stale one left over from an earlier deploy.
            docker compose --env-file ~/myapp.env ps
            for svc in spring-service langgraph-service graph-viewer-app; do
              cid=$(docker compose --env-file ~/myapp.env ps -q "$svc")
              if [ -z "$cid" ]; then echo "::error::$svc is not running"; exit 1; fi
              running_img=$(docker inspect -f '{{.Image}}' "$cid")
              latest_img=$(docker image inspect -f '{{.Id}}' "ghcr.io/alexandersayner/lang-graph-example/$svc:latest")
              if [ "$running_img" != "$latest_img" ]; then
                echo "::error::$svc is running a stale image ($running_img != $latest_img)"; exit 1
              fi
            done

            docker image prune -f
