version: '3.8'

services:
  # LangGraph gRPC Service
  langgraph-service:
    image: ghcr.io/alexandersayner/lang-graph-example/langgraph-service:latest
    build:
      context: ./python-langgraph-service
      dockerfile: Dockerfile
    container_name: langgraph-service
    ports:
      - "50051:50051"
    environment:
      - SERVER_PORT=50051
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://langgraph:langgraph_password@postgres:5432/langgraph_db
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - YC_API_KEY=${YC_API_KEY:-}
      - YC_FOLDER_ID=${YC_FOLDER_ID:-}
      - TOOL_SERVICE_HOST=spring-service
    depends_on:
      spring-service:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - langgraph-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc; channel = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(channel).result(timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  # Spring LangGraph Application
  spring-service:
    image: ghcr.io/alexandersayner/lang-graph-example/spring-service:latest
    build:
      context: ./spring-langgraph-app
      dockerfile: Dockerfile
    container_name: spring-langgraph-app
    ports:
      - "9191:9191"
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - LANGGRAPH_SERVICE_ADDRESS=langgraph-service:50051
      - JAVA_OPTS=-Xmx256m -Xms128m
      - YC_BILLING_ACCOUNT_ID=${YC_BILLING_ACCOUNT_ID:-}
      - YC_SA_KEY_JSON_B64=${YC_SA_KEY_JSON_B64:-}
    entrypoint: ["sh", "-c", "if [ -n \"$$YC_SA_KEY_JSON_B64\" ]; then export YC_SA_KEY_JSON=$$(echo \"$$YC_SA_KEY_JSON_B64\" | base64 -d); fi && exec java $$JAVA_OPTS -jar /app/app.jar"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - langgraph-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  graph-viewer-app:
    image: ghcr.io/alexandersayner/lang-graph-example/graph-viewer-app:latest
    build:
      context: ./graph-viewer-app
      dockerfile: Dockerfile
    container_name: graph-viewer-app
    ports:
      - "8080:80"
    depends_on:
      - langgraph-service
    networks:
      - langgraph-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: langgraph-postgres
    environment:
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: langgraph_password
      POSTGRES_DB: langgraph_db
    command: [
      'postgres',
      '-c', 'shared_buffers=128MB',
      '-c', 'max_connections=50',
      '-c', 'effective_cache_size=256MB',
      '-c', 'work_mem=4MB'
    ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "7432:5432"
    networks:
      - langgraph-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  # Redis Cache
  redis:
    image: redis/redis-stack-server:latest
    container_name: langgraph-redis
    command: redis-server --appendonly yes --protected-mode no --bind 0.0.0.0 --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6879:6379"
    networks:
      - langgraph-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

networks:
  langgraph-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
