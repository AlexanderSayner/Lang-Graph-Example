version: '3.8'

services:
  # LangGraph gRPC Service
  langgraph-service:
    build:
      context: ./python-langgraph-service
      dockerfile: Dockerfile
    container_name: langgraph-service
    ports:
      - "50051:50051"
    environment:
      - SERVER_PORT=50051
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://langgraph:langgraph_password@postgres:5432/langgraph_db
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TOOL_SERVICE_HOST=spring-service
    depends_on:
      spring-service:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - langgraph-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc; channel = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(channel).result(timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Spring LangGraph Application
  spring-service:
    build:
      context: ./spring-langgraph-app
      dockerfile: Dockerfile
    container_name: spring-langgraph-app
    ports:
      - "9191:9191"
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - LANGGRAPH_SERVICE_ADDRESS=langgraph-service:50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - langgraph-network
    restart: unless-stopped

  graph-viewer-app:
    build:
      context: ./graph-viewer-app
      dockerfile: Dockerfile
    container_name: graph-viewer-app
    ports:
      - "8080:80"
    depends_on:
      - langgraph-service
    networks:
      - langgraph-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: langgraph-postgres
    environment:
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: langgraph_password
      POSTGRES_DB: langgraph_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "7432:5432"
    networks:
      - langgraph-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis/redis-stack-server:latest
    container_name: langgraph-redis
    command: redis-server --appendonly yes --protected-mode no --bind 0.0.0.0
    volumes:
      - redis_data:/data
    ports:
      - "6879:6379"
    networks:
      - langgraph-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  langgraph-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
